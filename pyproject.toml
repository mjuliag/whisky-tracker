[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisky-tracker"
version = "0.1.0"
description = "Track whisky prices across Argentine retailers"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

